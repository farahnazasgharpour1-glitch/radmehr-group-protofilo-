name: Quality and Render diagnostics

on:
  push:
    branches:
      - main
      - quality-tooling/bootstrap
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-lint:
    name: JavaScript, HTML and CSS quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve and install development tooling
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit development dependencies
        run: npm audit

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Save generated lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: radmehr-quality-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  lighthouse:
    name: Lighthouse CI on all key static pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install development tooling
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Lighthouse CI
        run: npm run lhci

      - name: Upload private Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radmehr-lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 7

  render-dns:
    name: Compare Render DNS and HTTPS from GitHub's network
    runs-on: ubuntu-latest
    steps:
      - name: Compare public DNS answers
        shell: bash
        run: |
          set -e
          echo "=== System DNS: onrender.com ==="
          getent ahosts onrender.com
          echo "=== System DNS: preview hostname ==="
          getent ahosts radmehr-group-v2-preview.onrender.com
          echo "=== Google DNS-over-HTTPS: onrender.com ==="
          curl --fail --silent --show-error --max-time 20 'https://dns.google/resolve?name=onrender.com&type=A'
          echo
          echo "=== Google DNS-over-HTTPS: preview hostname ==="
          curl --fail --silent --show-error --max-time 20 'https://dns.google/resolve?name=radmehr-group-v2-preview.onrender.com&type=A'
          echo

      - name: Check live Render HTTPS
        shell: bash
        run: |
          curl --fail --silent --show-error -L --max-time 45 \
            -o /tmp/radmehr-preview.html \
            -w 'HTTP %{http_code}; elapsed %{time_total}s; remote IP %{remote_ip}\n' \
            'https://radmehr-group-v2-preview.onrender.com/'
          test -s /tmp/radmehr-preview.html
          grep -qi '<html' /tmp/radmehr-preview.html
